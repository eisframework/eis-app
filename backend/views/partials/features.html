<section class="py-20 bg-slate-900/50">
  <div class="container mx-auto px-6 max-w-7xl">
    <div class="text-center mb-16">
      <h2 class="text-3xl lg:text-4xl font-bold text-white mb-4"><%= it.title || "Features" %></h2>
      <p class="text-slate-400 text-lg max-w-2xl mx-auto"><%= it.description || "" %></p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      <% for (const feature of it.features) { %>
        <div class="bg-slate-800/50 backdrop-blur border border-slate-700 rounded-xl p-6 hover:border-brand-500/50 transition-colors">
          <div class="w-12 h-12 bg-brand-500/10 rounded-lg flex items-center justify-center mb-4">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-brand-500">
              <%= feature.icon %>
            </svg>
          </div>
          <h3 class="text-xl font-semibold text-white mb-2"><%= feature.title %></h3>
          <p class="text-slate-400"><%= feature.description %></p>
        </div>
      <% } %>
    </div>
  </div>
</section>
